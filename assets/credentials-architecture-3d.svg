<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="certBg" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#14080b" />
      <stop offset="50%" stop-color="#0a0507" />
      <stop offset="100%" stop-color="#030102" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGradCisco1" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#240c13" />
      <stop offset="60%" stop-color="#14060a" />
      <stop offset="100%" stop-color="#080304" />
    </linearGradient>
    <linearGradient id="cardGradCisco2" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#220d18" />
      <stop offset="60%" stop-color="#13060d" />
      <stop offset="100%" stop-color="#070205" />
    </linearGradient>
    <linearGradient id="cardGradScaler" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#1c160a" />
      <stop offset="60%" stop-color="#110d05" />
      <stop offset="100%" stop-color="#080602" />
    </linearGradient>
    <linearGradient id="cardGradRedHat" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#260e10" />
      <stop offset="60%" stop-color="#150708" />
      <stop offset="100%" stop-color="#090304" />
    </linearGradient>
    <linearGradient id="cardGradIbm" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#0a1626" />
      <stop offset="60%" stop-color="#050e18" />
      <stop offset="100%" stop-color="#02060b" />
    </linearGradient>

    <!-- Rim Gradients -->
    <linearGradient id="rimCrimson" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2647" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#eb1b38" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#800b1a" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="rimRose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#e11d48" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#881337" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="rimAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="rimRedHat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ee0000" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#cc0000" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#660000" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="rimCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.1" />
    </linearGradient>

    <!-- Circuit Bus Pattern -->
    <pattern id="busGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(235, 27, 56, 0.03)" stroke-width="1" />
    </pattern>

    <!-- Drop Shadow Filter -->
    <filter id="certShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <style>
    @keyframes pulseLine {
      0%, 100% { stroke-opacity: 0.2; }
      50% { stroke-opacity: 0.8; }
    }
    @keyframes flowDot {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    .pulse-bus { animation: pulseLine 3s ease-in-out infinite; }
    .flow-bus { stroke-dasharray: 6 4; animation: flowDot 1.5s linear infinite; }
    .c-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; font-weight: 800; font-size: 15px; }
    .c-inst { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; }
    .c-body { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 10px; }
    .c-badge { font-family: 'JetBrains Mono', monospace; font-size: 8.5px; font-weight: 700; letter-spacing: 0.08em; }
  </style>

  <!-- Background Base Container -->
  <rect x="0" y="0" width="1000" height="380" rx="18" fill="url(#certBg)" stroke="#260f14" stroke-width="1.5" />
  <rect x="0" y="0" width="1000" height="380" rx="18" fill="url(#busGrid)" />

  <!-- Top Circuit Header Bar -->
  <g transform="translate(24, 22)">
    <circle cx="6" cy="6" r="4" fill="#22c55e" />
    <text x="18" y="9.5" fill="#f5ece3" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="0.1em">
      VERIFIED CREDENTIAL ARCHITECTURE // CONTINUOUS LEARNING PIPELINE
    </text>
    <text x="952" y="9.5" text-anchor="end" fill="#eb1b38" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">
      5 INDUSTRY SPECIALIZATIONS • 100% VERIFIED
    </text>
    <line x1="0" y1="18" x2="952" y2="18" stroke="#240c12" stroke-width="1" />
  </g>

  <!-- Central Architecture Data Bus Lines connecting rows -->
  <path d="M 165 190 L 165 210 L 490 210 L 490 190" fill="none" stroke="#eb1b38" stroke-width="1.2" class="flow-bus" stroke-opacity="0.4" />
  <path d="M 490 210 L 490 230" fill="none" stroke="#eb1b38" stroke-width="1.2" stroke-opacity="0.6" />
  <path d="M 815 190 L 815 210 L 490 210" fill="none" stroke="#eb1b38" stroke-width="1.2" class="flow-bus" stroke-opacity="0.4" />

  <!-- ==================== ROW 1: 3 NODES ==================== -->

  <!-- NODE 1: HTML & CSS Essentials (Cisco) [x=24, y=50] -->
  <g transform="translate(24, 50)">
    <rect x="0" y="0" width="298" height="138" rx="14" fill="url(#cardGradCisco1)" stroke="#38131b" stroke-width="1.2" filter="url(#certShadow)" />
    <path d="M 14 0 L 284 0" stroke="url(#rimCrimson)" stroke-width="2" stroke-linecap="round" />
    
    <!-- Top badge -->
    <g transform="translate(16, 16)">
      <rect x="0" y="0" width="28" height="28" rx="7" fill="#240a10" stroke="#eb1b38" stroke-width="1" />
      <text x="14" y="19" text-anchor="middle" fill="#eb1b38" font-family="sans-serif" font-weight="900" font-size="13">01</text>
      <text x="36" y="13" fill="#ff4d66" class="c-inst">CISCO ACADEMY</text>
      <text x="36" y="25" fill="#8a736d" class="c-body" font-size="9">FOUNDATION LAYER</text>
      
      <rect x="180" y="2" width="86" height="18" rx="4" fill="#eb1b38" fill-opacity="0.15" stroke="#eb1b38" stroke-opacity="0.4" stroke-width="0.8" />
      <text x="223" y="14" text-anchor="middle" fill="#ff4d66" class="c-badge">2025 • ESSENTIALS</text>
    </g>

    <text x="16" y="70" fill="#ffffff" class="c-title">HTML &amp; CSS Essentials</text>
    <text x="16" y="90" fill="#d4beab" class="c-body">Semantic Web • Flexbox &amp; CSS Grid</text>
    <text x="16" y="106" fill="#8a736d" class="c-body">Accessible UX Standards (WCAG 2.1)</text>

    <!-- Bottom Status Seal -->
    <line x1="16" y1="120" x2="282" y2="120" stroke="#240c12" stroke-width="1" />
    <circle cx="22" cy="128" r="2.5" fill="#22c55e" />
    <text x="30" y="131" fill="#22c55e" class="c-badge">VERIFIED CREDENTIAL</text>
    <text x="282" y="131" text-anchor="end" fill="#6a5450" class="c-badge">UI/UX CORE</text>
  </g>

  <!-- NODE 2: JavaScript Essentials 1 & 2 (Cisco) [x=351, y=50] -->
  <g transform="translate(351, 50)">
    <rect x="0" y="0" width="298" height="138" rx="14" fill="url(#cardGradCisco2)" stroke="#38101e" stroke-width="1.2" filter="url(#certShadow)" />
    <path d="M 14 0 L 284 0" stroke="url(#rimRose)" stroke-width="2" stroke-linecap="round" />
    
    <!-- Top badge -->
    <g transform="translate(16, 16)">
      <rect x="0" y="0" width="28" height="28" rx="7" fill="#200914" stroke="#f43f5e" stroke-width="1" />
      <text x="14" y="19" text-anchor="middle" fill="#f43f5e" font-family="sans-serif" font-weight="900" font-size="13">02</text>
      <text x="36" y="13" fill="#fb7185" class="c-inst">CISCO ACADEMY</text>
      <text x="36" y="25" fill="#8a736d" class="c-body" font-size="9">EXECUTION ENGINE</text>
      
      <rect x="180" y="2" width="86" height="18" rx="4" fill="#f43f5e" fill-opacity="0.15" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="0.8" />
      <text x="223" y="14" text-anchor="middle" fill="#fb7185" class="c-badge">2026 • ADVANCED</text>
    </g>

    <text x="16" y="70" fill="#ffffff" class="c-title">JavaScript Essentials 1 &amp; 2</text>
    <text x="16" y="90" fill="#d4beab" class="c-body">ES6+ • Event Loop • Async / Await</text>
    <text x="16" y="106" fill="#8a736d" class="c-body">Closures • Prototypes • Memory Model</text>

    <!-- Bottom Status Seal -->
    <line x1="16" y1="120" x2="282" y2="120" stroke="#260e18" stroke-width="1" />
    <circle cx="22" cy="128" r="2.5" fill="#22c55e" />
    <text x="30" y="131" fill="#22c55e" class="c-badge">VERIFIED CREDENTIAL</text>
    <text x="282" y="131" text-anchor="end" fill="#6a5059" class="c-badge">CORE LOGIC</text>
  </g>

  <!-- NODE 3: Java Specialization (Scaler Topics) [x=678, y=50] -->
  <g transform="translate(678, 50)">
    <rect x="0" y="0" width="298" height="138" rx="14" fill="url(#cardGradScaler)" stroke="#33240f" stroke-width="1.2" filter="url(#certShadow)" />
    <path d="M 14 0 L 284 0" stroke="url(#rimAmber)" stroke-width="2" stroke-linecap="round" />
    
    <!-- Top badge -->
    <g transform="translate(16, 16)">
      <rect x="0" y="0" width="28" height="28" rx="7" fill="#1f1406" stroke="#f59e0b" stroke-width="1" />
      <text x="14" y="19" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-weight="900" font-size="13">03</text>
      <text x="36" y="13" fill="#fbbf24" class="c-inst">SCALER TOPICS</text>
      <text x="36" y="25" fill="#8a736d" class="c-body" font-size="9">SYSTEMS LAYER</text>
      
      <rect x="180" y="2" width="86" height="18" rx="4" fill="#d97706" fill-opacity="0.15" stroke="#d97706" stroke-opacity="0.4" stroke-width="0.8" />
      <text x="223" y="14" text-anchor="middle" fill="#fbbf24" class="c-badge">2026 • OOP / JVM</text>
    </g>

    <text x="16" y="70" fill="#ffffff" class="c-title">Java Course Specialization</text>
    <text x="16" y="90" fill="#d4beab" class="c-body">OOP Architecture • Collections Framework</text>
    <text x="16" y="106" fill="#8a736d" class="c-body">JVM Memory Internals • Robust Systems</text>

    <!-- Bottom Status Seal -->
    <line x1="16" y1="120" x2="282" y2="120" stroke="#251a0a" stroke-width="1" />
    <circle cx="22" cy="128" r="2.5" fill="#22c55e" />
    <text x="30" y="131" fill="#22c55e" class="c-badge">VERIFIED CREDENTIAL</text>
    <text x="282" y="131" text-anchor="end" fill="#68563c" class="c-badge">ENTERPRISE OOP</text>
  </g>

  <!-- ==================== ROW 2: 2 NODES ==================== -->

  <!-- NODE 4: Python Programming (Red Hat) [x=187, y=220] -->
  <g transform="translate(187, 220)">
    <rect x="0" y="0" width="300" height="138" rx="14" fill="url(#cardGradRedHat)" stroke="#381012" stroke-width="1.2" filter="url(#certShadow)" />
    <path d="M 14 0 L 286 0" stroke="url(#rimRedHat)" stroke-width="2" stroke-linecap="round" />
    
    <!-- Top badge -->
    <g transform="translate(16, 16)">
      <rect x="0" y="0" width="28" height="28" rx="7" fill="#240809" stroke="#ee0000" stroke-width="1" />
      <text x="14" y="19" text-anchor="middle" fill="#ee0000" font-family="sans-serif" font-weight="900" font-size="13">04</text>
      <text x="36" y="13" fill="#ff4d4d" class="c-inst">RED HAT</text>
      <text x="36" y="25" fill="#8a736d" class="c-body" font-size="9">AUTOMATION RUNTIME</text>
      
      <rect x="180" y="2" width="88" height="18" rx="4" fill="#cc0000" fill-opacity="0.15" stroke="#cc0000" stroke-opacity="0.4" stroke-width="0.8" />
      <text x="224" y="14" text-anchor="middle" fill="#ff4d4d" class="c-badge">2026 • TOOLING</text>
    </g>

    <text x="16" y="70" fill="#ffffff" class="c-title">Python Programming Spec.</text>
    <text x="16" y="90" fill="#d4beab" class="c-body">Automation Scripts • Tooling Ecosystem</text>
    <text x="16" y="106" fill="#8a736d" class="c-body">Data Structs • High-Performance Scripts</text>

    <!-- Bottom Status Seal -->
    <line x1="16" y1="120" x2="284" y2="120" stroke="#25090b" stroke-width="1" />
    <circle cx="22" cy="128" r="2.5" fill="#22c55e" />
    <text x="30" y="131" fill="#22c55e" class="c-badge">VERIFIED CREDENTIAL</text>
    <text x="284" y="131" text-anchor="end" fill="#693e41" class="c-badge">PIPELINE DEV</text>
  </g>

  <!-- NODE 5: Generative AI & Prompt Engineering (IBM Skills Network) [x=513, y=220] -->
  <g transform="translate(513, 220)">
    <rect x="0" y="0" width="300" height="138" rx="14" fill="url(#cardGradIbm)" stroke="#112236" stroke-width="1.2" filter="url(#certShadow)" />
    <path d="M 14 0 L 286 0" stroke="url(#rimCyan)" stroke-width="2" stroke-linecap="round" />
    
    <!-- Top badge -->
    <g transform="translate(16, 16)">
      <rect x="0" y="0" width="28" height="28" rx="7" fill="#06121f" stroke="#0ea5e9" stroke-width="1" />
      <text x="14" y="19" text-anchor="middle" fill="#0ea5e9" font-family="sans-serif" font-weight="900" font-size="13">05</text>
      <text x="36" y="13" fill="#38bdf8" class="c-inst">IBM SKILLS NETWORK</text>
      <text x="36" y="25" fill="#8a736d" class="c-body" font-size="9">COGNITIVE CLASS</text>
      
      <rect x="180" y="2" width="88" height="18" rx="4" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-opacity="0.4" stroke-width="0.8" />
      <text x="224" y="14" text-anchor="middle" fill="#38bdf8" class="c-badge">2025 • GEN AI</text>
    </g>

    <text x="16" y="70" fill="#ffffff" class="c-title">Generative AI &amp; Prompt Eng.</text>
    <text x="16" y="90" fill="#d4beab" class="c-body">Foundation Models • Context Optimization</text>
    <text x="16" y="106" fill="#8a736d" class="c-body">LLM Integration &amp; Cognitive Pipelines</text>

    <!-- Bottom Status Seal -->
    <line x1="16" y1="120" x2="284" y2="120" stroke="#0c1926" stroke-width="1" />
    <circle cx="22" cy="128" r="2.5" fill="#22c55e" />
    <text x="30" y="131" fill="#22c55e" class="c-badge">VERIFIED CREDENTIAL</text>
    <text x="284" y="131" text-anchor="end" fill="#3f5a70" class="c-badge">NEXT-GEN AI</text>
  </g>

</svg>
