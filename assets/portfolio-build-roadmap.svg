<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="roadBg" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#14080b" />
      <stop offset="50%" stop-color="#0a0507" />
      <stop offset="100%" stop-color="#030102" />
    </linearGradient>

    <!-- Road Surface Gradient -->
    <linearGradient id="roadGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0b10" />
      <stop offset="50%" stop-color="#12070a" />
      <stop offset="100%" stop-color="#1e0c12" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#240c13" />
      <stop offset="50%" stop-color="#13060a" />
      <stop offset="100%" stop-color="#080304" />
    </linearGradient>

    <linearGradient id="rimRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2647" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#eb1b38" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#800b1a" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="rimCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="rimAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="rimGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#22c55e" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#14532d" stop-opacity="0.1" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="roadGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(235, 27, 56, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="roadGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.88" />
    </filter>
  </defs>

  <style>
    @keyframes dashMove {
      from { stroke-dashoffset: 60; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(1.15); }
    }
    .road-center {
      stroke-dasharray: 14 10;
      animation: dashMove 2.5s linear infinite;
    }
    .pulse-pin {
      animation: pulseGlow 2.5s ease-in-out infinite;
      transform-origin: center;
    }
    .m-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; font-weight: 800; font-size: 15px; }
    .m-sub { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; }
    .m-body { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 9.5px; }
    .m-tag { font-family: 'JetBrains Mono', monospace; font-size: 8.5px; font-weight: 700; letter-spacing: 0.08em; }
  </style>

  <!-- Container Base -->
  <rect x="0" y="0" width="1000" height="620" rx="18" fill="url(#roadBg)" stroke="#260e15" stroke-width="1.5" />
  <rect x="0" y="0" width="1000" height="620" rx="18" fill="url(#roadGrid)" />

  <!-- Top Title HUD Bar -->
  <g transform="translate(36, 26)">
    <circle cx="6" cy="6" r="4.5" fill="#eb1b38" />
    <text x="20" y="10" fill="#f5ece3" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="0.12em">
      PORTFOLIO ARCHITECTURE ROADMAP // HOW WE BUILT THIS EXPERIENCE
    </text>
    <text x="928" y="10" text-anchor="end" fill="#eb1b38" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">
      6-STAGE ENGINEERING PIPELINE
    </text>
    <line x1="0" y1="18" x2="928" y2="18" stroke="#240c12" stroke-width="1" />
  </g>

  <!-- ==================== THE WINDING ROADWAY (HIGHWAY) ==================== -->
  
  <!-- Outer Road Bed / Pavement -->
  <path d="M 80 120 
           C 250 120, 320 180, 500 180 
           C 680 180, 750 120, 920 120
           C 960 120, 960 270, 920 270
           C 750 270, 680 340, 500 340
           C 320 340, 250 270, 80 270
           C 40 270, 40 430, 80 430
           C 250 430, 320 500, 500 500
           C 680 500, 750 500, 920 500"
        fill="none" stroke="#1c0b11" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Road Borders / Curbs -->
  <path d="M 80 120 
           C 250 120, 320 180, 500 180 
           C 680 180, 750 120, 920 120
           C 960 120, 960 270, 920 270
           C 750 270, 680 340, 500 340
           C 320 340, 250 270, 80 270
           C 40 270, 40 430, 80 430
           C 250 430, 320 500, 500 500
           C 680 500, 750 500, 920 500"
        fill="none" stroke="#3d1520" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Inner Asphalt Track -->
  <path d="M 80 120 
           C 250 120, 320 180, 500 180 
           C 680 180, 750 120, 920 120
           C 960 120, 960 270, 920 270
           C 750 270, 680 340, 500 340
           C 320 340, 250 270, 80 270
           C 40 270, 40 430, 80 430
           C 250 430, 320 500, 500 500
           C 680 500, 750 500, 920 500"
        fill="none" stroke="#12060a" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Road Center Dashed Line (Animated) -->
  <path d="M 80 120 
           C 250 120, 320 180, 500 180 
           C 680 180, 750 120, 920 120
           C 960 120, 960 270, 920 270
           C 750 270, 680 340, 500 340
           C 320 340, 250 270, 80 270
           C 40 270, 40 430, 80 430
           C 250 430, 320 500, 500 500
           C 680 500, 750 500, 920 500"
        fill="none" stroke="#eb1b38" stroke-width="2.2" class="road-center" />

  <!-- ==================== STAGE MILESTONES & 3D CARDS ==================== -->

  <!-- STAGE 01: ARCHITECTURE RIG (Top Left: Milestone pin at 80, 120 | Card at 36, 138) -->
  <g transform="translate(36, 140)">
    <circle cx="44" cy="-20" r="16" fill="#eb1b38" fill-opacity="0.2" class="pulse-pin" />
    <circle cx="44" cy="-20" r="7" fill="#eb1b38" stroke="#ffffff" stroke-width="2" />
    
    <rect x="0" y="0" width="270" height="110" rx="12" fill="url(#cardGrad)" stroke="#3f141d" stroke-width="1.2" filter="url(#cardShadow)" />
    <path d="M 12 0 L 258 0" stroke="url(#rimRed)" stroke-width="2" stroke-linecap="round" />
    <text x="14" y="20" fill="#ff4d66" class="m-sub">01 // FOUNDATION &amp; DESIGN</text>
    <text x="14" y="40" fill="#ffffff" class="m-title">Architecture Rig</text>
    <text x="14" y="60" fill="#d4beab" class="m-body">React 18 • TypeScript 5.7 • Vite 6</text>
    <text x="14" y="76" fill="#8a736d" class="m-body">Hoy obsidian &amp; crimson tokens (#120d0f)</text>
    <text x="14" y="96" fill="#22c55e" class="m-tag">● RIG INITIALIZED</text>
  </g>

  <!-- STAGE 02: GPU SHADERS & WEBGL (Top Center: Milestone pin at 500, 180 | Card at 365, 58) -->
  <g transform="translate(365, 58)">
    <circle cx="135" cy="122" r="16" fill="#38bdf8" fill-opacity="0.2" class="pulse-pin" />
    <circle cx="135" cy="122" r="7" fill="#0284c7" stroke="#ffffff" stroke-width="2" />

    <rect x="0" y="0" width="270" height="110" rx="12" fill="url(#cardGrad)" stroke="#112433" stroke-width="1.2" filter="url(#cardShadow)" />
    <path d="M 12 0 L 258 0" stroke="url(#rimCyan)" stroke-width="2" stroke-linecap="round" />
    <text x="14" y="20" fill="#38bdf8" class="m-sub">02 // GPU SHADER PIPELINE</text>
    <text x="14" y="40" fill="#ffffff" class="m-title">GLSL Compositor</text>
    <text x="14" y="60" fill="#d4beab" class="m-body">CAD vector crosshairs &amp; disc blur</text>
    <text x="14" y="76" fill="#8a736d" class="m-body">GlimmerVale particle canvas in WebGL</text>
    <text x="14" y="96" fill="#38bdf8" class="m-tag">● 60 FPS FRAGMENT SHADER</text>
  </g>

  <!-- STAGE 03: 3D SPHERICAL ORBIT (Top Right: Milestone pin at 920, 120 | Card at 694, 140) -->
  <g transform="translate(694, 140)">
    <circle cx="226" cy="-20" r="16" fill="#fb7185" fill-opacity="0.2" class="pulse-pin" />
    <circle cx="226" cy="-20" r="7" fill="#f43f5e" stroke="#ffffff" stroke-width="2" />

    <rect x="0" y="0" width="270" height="110" rx="12" fill="url(#cardGrad)" stroke="#38101a" stroke-width="1.2" filter="url(#cardShadow)" />
    <path d="M 12 0 L 258 0" stroke="url(#rimRed)" stroke-width="2" stroke-linecap="round" />
    <text x="14" y="20" fill="#fb7185" class="m-sub">03 // 3D SPHERICAL PHYSICS</text>
    <text x="14" y="40" fill="#ffffff" class="m-title">Fibonacci Orbit</text>
    <text x="14" y="60" fill="#d4beab" class="m-body">34 skills on golden spiral lattice</text>
    <text x="14" y="76" fill="#8a736d" class="m-body">Quaternion rotation &amp; drag momentum</text>
    <text x="14" y="96" fill="#fb7185" class="m-tag">● 3D DEPTH SORTING</text>
  </g>

  <!-- STAGE 04: 60FPS ECO GOVERNOR (Mid-Left: Milestone pin at 500, 340 | Card at 365, 365) -->
  <g transform="translate(365, 365)">
    <circle cx="135" cy="-25" r="16" fill="#fbbf24" fill-opacity="0.2" class="pulse-pin" />
    <circle cx="135" cy="-25" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="2" />

    <rect x="0" y="0" width="270" height="110" rx="12" fill="url(#cardGrad)" stroke="#33240f" stroke-width="1.2" filter="url(#cardShadow)" />
    <path d="M 12 0 L 258 0" stroke="url(#rimAmber)" stroke-width="2" stroke-linecap="round" />
    <text x="14" y="20" fill="#fbbf24" class="m-sub">04 // KINETIC ENGINE</text>
    <text x="14" y="40" fill="#ffffff" class="m-title">60 FPS Eco Governor</text>
    <text x="14" y="60" fill="#d4beab" class="m-body">Lenis virtual inertial momentum scroll</text>
    <text x="14" y="76" fill="#8a736d" class="m-body">Battery Status API &amp; CPU concurrency</text>
    <text x="14" y="96" fill="#fbbf24" class="m-tag">● ECO THROTTLING READY</text>
  </g>

  <!-- STAGE 05: IN-SITU & COMMAND PALETTE (Bottom-Left: Milestone pin at 80, 430 | Card at 36, 455) -->
  <g transform="translate(36, 455)">
    <circle cx="44" cy="-25" r="16" fill="#eb1b38" fill-opacity="0.2" class="pulse-pin" />
    <circle cx="44" cy="-25" r="7" fill="#eb1b38" stroke="#ffffff" stroke-width="2" />

    <rect x="0" y="0" width="270" height="110" rx="12" fill="url(#cardGrad)" stroke="#3f141d" stroke-width="1.2" filter="url(#cardShadow)" />
    <path d="M 12 0 L 258 0" stroke="url(#rimRed)" stroke-width="2" stroke-linecap="round" />
    <text x="14" y="20" fill="#ff4d66" class="m-sub">05 // TELEMETRY &amp; HUD</text>
    <text x="14" y="40" fill="#ffffff" class="m-title">Command Palette ⌘K</text>
    <text x="14" y="60" fill="#d4beab" class="m-body">Web Audio API mechanical click synth</text>
    <text x="14" y="76" fill="#8a736d" class="m-body">Interactive CLI &amp; in-situ test sandbox</text>
    <text x="14" y="96" fill="#eb1b38" class="m-tag">● ZERO-LATENCY AUDIO</text>
  </g>

  <!-- STAGE 06: PRODUCTION HARDENING & SHIP (Bottom-Right: Milestone pin at 920, 500 | Card at 694, 455) -->
  <g transform="translate(694, 455)">
    <circle cx="226" cy="45" r="16" fill="#22c55e" fill-opacity="0.2" class="pulse-pin" />
    <circle cx="226" cy="45" r="7" fill="#22c55e" stroke="#ffffff" stroke-width="2" />

    <rect x="0" y="0" width="270" height="110" rx="12" fill="url(#cardGrad)" stroke="#13381e" stroke-width="1.2" filter="url(#cardShadow)" />
    <path d="M 12 0 L 258 0" stroke="url(#rimGreen)" stroke-width="2" stroke-linecap="round" />
    <text x="14" y="20" fill="#4ade80" class="m-sub">06 // SHIP &amp; PRODUCTION</text>
    <text x="14" y="40" fill="#ffffff" class="m-title">CollabSpace &amp; Deploy</text>
    <text x="14" y="60" fill="#d4beab" class="m-body">16-Table Supabase RLS SaaS showcase</text>
    <text x="14" y="76" fill="#8a736d" class="m-body">Strict TypeScript • 0 compilation warnings</text>
    <text x="14" y="96" fill="#22c55e" class="m-tag">● PRODUCTION READY SHIP</text>
  </g>

</svg>
