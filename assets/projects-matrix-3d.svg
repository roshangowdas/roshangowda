      <circle cx="17" cy="17" r="8" fill="none" stroke="#38bdf8" stroke-width="1.3" />
      <ellipse cx="17" cy="17" rx="3.5" ry="8" fill="none" stroke="#38bdf8" stroke-width="1" />
      <line x1="9" y1="17" x2="25" y2="17" stroke="#38bdf8" stroke-width="1" />

      <text x="44" y="16" fill="#ffffff" class="p-title">Community Resource Sharing</text>
      <text x="44" y="30" fill="#a89589" class="p-sub">Full-Stack Collaborative Inventory Exchange Platform</text>

      <rect x="360" y="4" width="70" height="22" rx="6" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-opacity="0.4" stroke-width="1" />
      <text x="395" y="18.5" text-anchor="middle" fill="#38bdf8" class="p-badge">MERN STACK</text>
    </g>

    <text x="20" y="88" fill="#d4beab" class="p-mono">Community tool &amp; equipment sharing platform with role-based access,</text>
    <text x="20" y="106" fill="#d4beab" class="p-mono">inventory tracking, booking schedules, and indexing for high concurrency.</text>

    <!-- Key Metrics Highlight Strip -->
    <g transform="translate(20, 122)">
      <rect x="0" y="0" width="435" height="28" rx="6" fill="#040b12" stroke="#0d1b28" stroke-width="1" />
      <text x="12" y="18" fill="#38bdf8" class="p-badge">IMPACT:</text>
      <text x="65" y="18" fill="#f5ece3" class="p-mono" font-size="10.5">10 RESTful Endpoints • Firebase Session Auth • Indexed Queries</text>
    </g>

    <!-- Tech Chips -->
    <g transform="translate(20, 164)">
      <text x="0" y="16" fill="#8a736d" class="p-mono">TECH:</text>
      <rect x="42" y="2" width="62" height="18" rx="4" fill="#08141f" stroke="#102538" stroke-width="1" />
      <text x="73" y="14.5" text-anchor="middle" fill="#f5ece3" class="p-mono" font-size="9.5">React.js</text>

      <rect x="110" y="2" width="62" height="18" rx="4" fill="#08141f" stroke="#102538" stroke-width="1" />
      <text x="141" y="14.5" text-anchor="middle" fill="#f5ece3" class="p-mono" font-size="9.5">Node.js</text>

      <rect x="178" y="2" width="68" height="18" rx="4" fill="#08141f" stroke="#102538" stroke-width="1" />
      <text x="212" y="14.5" text-anchor="middle" fill="#f5ece3" class="p-mono" font-size="9.5">Express.js</text>

      <rect x="252" y="2" width="84" height="18" rx="4" fill="#08141f" stroke="#102538" stroke-width="1" />
      <text x="294" y="14.5" text-anchor="middle" fill="#f5ece3" class="p-mono" font-size="9.5">MongoDB Atlas</text>

      <rect x="342" y="2" width="92" height="18" rx="4" fill="#08141f" stroke="#102538" stroke-width="1" />
      <text x="388" y="14.5" text-anchor="middle" fill="#f5ece3" class="p-mono" font-size="9.5">Firebase Auth</text>
    </g>
  </g>

  <!-- ==================== CARD 4: AI-PETCARE (Bottom Right: 510, 230) ==================== -->
  <g transform="translate(510, 230)">
    <rect x="0" y="0" width="475" height="198" rx="16" fill="url(#cardGradAi)" stroke="#31220f" stroke-width="1.3" filter="url(#pShadow)" />
    <path d="M 16 0 L 459 0" stroke="url(#rimAmber)" stroke-width="2.2" stroke-linecap="round" />
    
    <!-- Top row badge & category -->
    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="34" height="34" rx="8" fill="#201507" stroke="#f59e0b" stroke-width="1" />
      <path d="M 17 8 L 10 17 L 15 17 L 13 26 L 22 15 L 17 15 Z" fill="#fbbf24" stroke="#d97706" stroke-width="0.8" />

      <text x="44" y="16" fill="#ffffff" class="p-title">AI-PetCare</text>
      <text x="44" y="30" fill="#a89589" class="p-sub">Interactive Pet Health Monitoring &amp; Diagnostics</text>

      <rect x="360" y="4" width="70" height="22" rx="6" fill="#d97706" fill-opacity="0.15" stroke="#d97706" stroke-opacity="0.4" stroke-width="1" />
      <text x="395" y="18.5" text-anchor="middle" fill="#fbbf24" class="p-badge">DIAGNOSTIC</text>
    </g>

    <text x="20" y="88" fill="#d4beab" class="p-mono">Responsive care log, symptom tracking, and diagnostic checklists</text>
    <text x="20" y="106" fill="#d4beab" class="p-mono">for pet owners, maintaining sub-15ms client-side interaction times.</text>

    <!-- Key Metrics Highlight Strip -->
    <g transform="translate(20, 122)">
      <rect x="0" y="0" width="435" height="28" rx="6" fill="#0a0703" stroke="#24190a" stroke-width="1" />
      <text x="12" y="18" fill="#fbbf24" class="p-badge">IMPACT:</text>
      <text x="65" y="18" fill="#f5ece3" class="p-mono" font-size="10.5">Mobile-First Layouts • Sub-15ms Triage • Accessible Forms</text>
    </g>

    <!-- Tech Chips -->
    <g transform="translate(20, 164)">
      <text x="0" y="16" fill="#8a736d" class="p-mono">TECH:</text>
      <rect x="42" y="2" width="60" height="18" rx="4" fill="#1b1206" stroke="#36240d" stroke-width="1" />
      <text x="72" y="14.5" text-anchor="middle" fill="#f5ece3" class="p-mono" font-size="9.5">HTML5</text>

      <rect x="108" y="2" width="56" height="18" rx="4" fill="#1b1206" stroke="#36240d" stroke-width="1" />
      <text x="136" y="14.5" text-anchor="middle" fill="#f5ece3" class="p-mono" font-size="9.5">CSS3</text>

      <rect x="170" y="2" width="102" height="18" rx="4" fill="#1b1206" stroke="#36240d" stroke-width="1" />
      <text x="221" y="14.5" text-anchor="middle" fill="#f5ece3" class="p-mono" font-size="9.5">JavaScript ES6+</text>

      <rect x="278" y="2" width="90" height="18" rx="4" fill="#1b1206" stroke="#36240d" stroke-width="1" />
      <text x="323" y="14.5" text-anchor="middle" fill="#f5ece3" class="p-mono" font-size="9.5">Responsive UI</text>

      <rect x="374" y="2" width="60" height="18" rx="4" fill="#1b1206" stroke="#36240d" stroke-width="1" />
      <text x="404" y="14.5" text-anchor="middle" fill="#f5ece3" class="p-mono" font-size="9.5">Analytics</text>
    </g>
